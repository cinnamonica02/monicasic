name: Integer A2 reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integer-a2:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      UV_PROJECT_ENVIRONMENT: .venv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.10"

      - name: Cache Hugging Face files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-hf-qwen3-${{ hashFiles('tiny_moe/ref/*.py', 'data/quality_set_recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-hf-qwen3-

      - name: Install reference dependencies
        run: uv sync --group ref

      - name: Run official A2 reference
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_integer_a2.sh 2>&1 | tee integer-a2.log

      - name: Upload A2 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integer-a2-results
          if-no-files-found: warn
          path: |
            integer-a2.log
            out/quality_ref/
            out/integer_ref/
